[project]
name = "erp-backend"
version = "0.1.0"
description = "ERP system backend and frontend workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.4,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "Pillow>=10.0,<12.0",
    "xlrd>=2.0,<3.0",
    "xlwt>=1.3,<2.0",
    "openpyxl>=3.1,<4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["backend/migrations", "backups", "tmp", "outputs"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend"]
